name: CML - AQI Model Evaluation

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Check repository files
        run: |
          pwd
          ls -la
          echo "Checking evaluate_model.py..."
          ls -l evaluate_model.py
          echo "Checking city_day.csv..."
          ls -lh city_day.csv

      - name: Run AQI model evaluation
        run: |
          python evaluate_model.py

      - name: Check generated metrics
        run: |
          echo "Checking metrics.txt..."
          ls -lh metrics.txt
          echo "----- METRICS -----"
          cat metrics.txt

      - name: Install CML
        uses: iterative/setup-cml@v2

      - name: Create CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## AQI Model Evaluation" > report.md
          echo "" >> report.md
          echo "The AQI Random Forest model was evaluated using the test dataset." >> report.md
          echo "" >> report.md
          echo "### Evaluation Metrics" >> report.md
          echo "" >> report.md

          cat metrics.txt >> report.md

          echo "" >> report.md
          echo "Evaluation completed successfully." >> report.md

          echo "----- CML REPORT -----"
          cat report.md

          cml comment create report.md