name: CML - AQI Model Evaluation

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # CHECKOUT
      # -----------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # PYTHON SETUP
      # -----------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      # -----------------------------
      # CHECK FILES
      # -----------------------------

      - name: Check repository files
        run: |
          pwd
          ls -la

          echo "Checking evaluate_model.py..."
          ls -l evaluate_model.py

          echo "Checking city_day.csv..."
          ls -lh city_day.csv

      # -----------------------------
      # MODEL EVALUATION
      # -----------------------------

      - name: Run AQI model evaluation
        run: |
          python evaluate_model.py

      - name: Check generated metrics
        run: |
          echo "Checking metrics.txt..."

          ls -lh metrics.txt

          echo "----- METRICS -----"
          cat metrics.txt

      # -----------------------------
      # DOCKER
      # -----------------------------

      - name: Build Docker image
        run: |
          docker build -t aqi-api .

      - name: Run Docker container
        run: |
          docker run -d \
            --name aqi-container \
            -p 5000:5000 \
            aqi-api

          echo "Waiting for container..."
          sleep 10

          echo "----- CONTAINER STATUS -----"
          docker ps -a

      - name: Test Docker API
        run: |
          echo "Testing AQI API..."

          curl --fail http://localhost:5000/ || true

      - name: Show Docker logs
        if: always()
        run: |
          echo "================================"
          echo "        DOCKER LOGS"
          echo "================================"

          docker logs aqi-container 2>&1 || true

      # -----------------------------
      # CHECK GITHUB TOKEN PERMISSIONS
      # -----------------------------

      - name: Check GitHub Actions permissions
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"

          echo "Testing GitHub API access..."

          curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" \
            | python -c "import sys,json; d=json.load(sys.stdin); print('Repository:', d.get('full_name')); print('Permissions:', d.get('permissions'))"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # CML
      # -----------------------------

      - name: Install CML
        uses: iterative/setup-cml@v2

      # -----------------------------
      # CML TOKEN CHECK
      # -----------------------------

      - name: Check GitHub token permissions
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"

          curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" \
            | python -c "import sys,json; d=json.load(sys.stdin); print('Repository permissions:', d.get('permissions'))"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # CREATE CML REPORT
      # -----------------------------

      - name: Create CML report
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# AQI Model Evaluation" > report.md
          echo "" >> report.md

          echo "## Metrics" >> report.md
          echo "" >> report.md

          if [ -f metrics.txt ]; then
            cat metrics.txt >> report.md
          else
            echo "Metrics file was not generated." >> report.md
          fi

          echo "" >> report.md

          echo "## Docker Logs" >> report.md
          echo "" >> report.md

          echo '```text' >> report.md

          docker logs aqi-container 2>&1 >> report.md || \
            echo "Docker container not available." >> report.md

          echo '```' >> report.md

          echo "" >> report.md

          echo "Evaluation was executed automatically by GitHub Actions using \`evaluate_model.py\`." >> report.md

          echo ""
          echo "================================"
          echo "       FINAL CML REPORT"
          echo "================================"

          cat report.md

          cml comment create report.md