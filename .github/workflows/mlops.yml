name: AQI MLOps CI

on:
  push:
    branches:
      - main
      - cml-test
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # CHECKOUT
      # -----------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      # -----------------------------
      # PYTHON SETUP
      # -----------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------
      # INSTALL DEPENDENCIES
      # -----------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # -----------------------------
      # PYTHON SYNTAX
      # -----------------------------

      - name: Check Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile evaluate_model.py

      # -----------------------------
      # CHECK DATASET
      # -----------------------------

      - name: Check dataset
        run: |
          test -f city_day.csv
          ls -lh city_day.csv

      # -----------------------------
      # CHECK MODEL
      # -----------------------------

      - name: Check model file
        run: |
          test -f model/final_aqi_rf_pipeline.pkl
          ls -lh model/final_aqi_rf_pipeline.pkl

      # -----------------------------
      # ML EVALUATION
      # -----------------------------

      - name: Run ML evaluation
        run: |
          python evaluate_model.py

      # -----------------------------
      # PYTEST
      # -----------------------------

      - name: Run tests
        run: |
          pytest

      # -----------------------------
      # DOCKER BUILD
      # -----------------------------

      - name: Build Docker image
        run: |
          docker build -t aqi-api:ci .

      # -----------------------------
      # DOCKER RUN
      # -----------------------------

      - name: Run Docker container
        run: |
          docker run -d \
            --name aqi-container-test \
            -e PORT=5000 \
            -p 5000:5000 \
            aqi-api:ci

      # -----------------------------
      # WAIT FOR API
      # -----------------------------

      - name: Wait for Docker API
        run: |
          echo "Waiting for AQI API..."

          for i in {1..30}; do
            if curl --fail --silent http://localhost:5000/ > /dev/null; then
              echo "AQI API is ready."
              exit 0
            fi

            echo "Attempt $i: API not ready yet..."
            sleep 2
          done

          echo "AQI API failed to start."

          echo "----- DOCKER STATUS -----"
          docker ps -a

          echo "----- DOCKER LOGS -----"
          docker logs aqi-container-test 2>&1 || true

          exit 1

      # -----------------------------
      # TEST PREDICTION API
      # -----------------------------

      - name: Test Docker prediction API
        run: |
          response=$(curl --fail --silent \
            -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "City": "Ahmedabad",
              "PM2.5": 80,
              "PM10": 120,
              "NO": 20,
              "NO2": 40,
              "NOx": 45,
              "NH3": 10,
              "CO": 1.2,
              "SO2": 15,
              "O3": 50,
              "Benzene": 2,
              "Toluene": 5,
              "Xylene": 1
            }')

          echo "Docker prediction response:"
          echo "$response"

          echo "$response" | grep -q "predicted_AQI"

      # -----------------------------
      # DOCKER LOGS
      # -----------------------------

      - name: Show Docker logs
        if: always()
        run: |
          echo "================================"
          echo "        DOCKER LOGS"
          echo "================================"

          docker logs aqi-container-test 2>&1 || true

      # -----------------------------
      # STOP CONTAINER
      # -----------------------------

      - name: Stop Docker container
        if: always()
        run: |
          docker stop aqi-container-test || true
          docker rm aqi-container-test || true