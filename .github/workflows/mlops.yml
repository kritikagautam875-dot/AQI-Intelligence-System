name: AQI MLOps CI

on:
  push:
    branches:
      - main
      - cml-test
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Set up CML
        uses: iterative/setup-cml@v2
        with : 
           vega: false

      - name: Check Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile evaluate_model.py

      - name: Check dataset
        run: |
          test -f city_day.csv
          ls -lh city_day.csv

      - name: Check model file
        run: |
          test -f model/final_aqi_rf_pipeline.pkl
          ls -lh model/final_aqi_rf_pipeline.pkl

      - name: Run ML evaluation
        run: |
          python evaluate_model.py

      - name: Create CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# AQI Model Evaluation" > report.md
          echo "" >> report.md
          echo "## Metrics" >> report.md
          cat metrics.txt >> report.md
          echo "" >> report.md
          echo "Evaluation was executed automatically by GitHub Actions using \`evaluate_model.py\`." >> report.md

          cat report.md

          cml comment create report.md

      - name: Run tests
        run: |
          pytest

      - name: Build Docker image
        run: |
          docker build -t aqi-api:ci .

      - name: Run Docker container
        run: |
          docker run -d \
            --name aqi-container-test \
            -p 5000:5000 \
            aqi-api:ci

      - name: Wait for Docker API
        run: |
          echo "Waiting for AQI API..."

          for i in {1..30}; do
            if curl --fail --silent http://localhost:5000/ > /dev/null; then
              echo "AQI API is ready."
              exit 0
            fi

            echo "Attempt $i: API not ready yet..."
            sleep 2
          done

          echo "AQI API failed to start."
          docker logs aqi-container-test
          exit 1

      - name: Test Docker prediction API
        run: |
          response=$(curl --fail --silent \
            -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "City": "Ahmedabad",
              "PM2.5": 80,
              "PM10": 120,
              "NO": 20,
              "NO2": 40,
              "NOx": 45,
              "NH3": 10,
              "CO": 1.2,
              "SO2": 15,
              "O3": 50,
              "Benzene": 2,
              "Toluene": 5,
              "Xylene": 1
            }')

          echo "Docker prediction response:"
          echo "$response"

          echo "$response" | grep -q "predicted_AQI"

      - name: Show Docker logs
        if: always()
        run: |
          docker logs aqi-container-test

      - name: Stop Docker container
        if: always()
        run: |
          docker stop aqi-container-test || true
          docker rm aqi-container-test || true